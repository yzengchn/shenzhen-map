<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="深圳科技公司的高保真3D交互地图，逐街区探索。"
    />
    <title>深圳科技地图</title>

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="深圳科技地图" />
    <meta property="og:title" content="深圳科技地图：深圳科技公司3D地图" />
    <meta
      property="og:description"
      content="深圳通信、电子、机器人与AI公司的3D交互地图，按街区探索南山、福田、前海和坂田。"
    />
    <meta property="og:image" content="./og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="深圳科技公司3D地图" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="深圳科技地图：深圳科技公司3D地图" />
    <meta
      name="twitter:description"
      content="深圳科技公司的3D交互地图，按街区探索。"
    />
    <meta name="twitter:image" content="./og.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./fonts/GeistVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="atlas-shell">
      <canvas id="scene" aria-label="深圳科技公司3D交互地图"></canvas>
      <div id="labelsLayer" class="labels-layer" aria-hidden="false"></div>

      <div class="hud-left">
        <aside class="rail" aria-label="深圳科技地图导航">
          <a class="brand" href="#" aria-label="深圳科技地图首页">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
              <!-- Map pin: the atlas mark. Balanced teardrop with a round
                   aperture, drawn upright so it reads at any size. -->
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M16 29.5 C12.2 23.5 7.5 17.5 7.5 12 A8.5 8.5 0 1 1 24.5 12 C24.5 17.5 19.8 23.5 16 29.5 Z M16 8.8 A3.2 3.2 0 1 0 16 15.2 A3.2 3.2 0 1 0 16 8.8 Z"
              />
            </svg>
            <span class="brand__text">
              <h1>深圳科技地图</h1>
              <span class="brand__sub">47家公司 · 7大产业片区</span>
            </span>
          </a>

          <nav id="areaList" class="area-list" aria-label="按区域探索"></nav>

          <div class="rail__foot">
            <div id="pinLegend" class="pin-legend"></div>
            <a
              class="rail__cta"
              href="https://github.com/yzengchn/shenzhen-map/blob/main/CONTRIBUTING.md"
              target="_blank"
              rel="noreferrer noopener"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.7-4.04-1.58-4.04-1.58-.55-1.36-1.33-1.73-1.33-1.73-1.09-.73.08-.71.08-.71 1.2.08 1.83 1.21 1.83 1.21 1.07 1.8 2.81 1.28 3.5.98.11-.76.42-1.28.76-1.57-2.67-.3-5.47-1.3-5.47-5.79 0-1.28.47-2.33 1.23-3.15-.12-.29-.53-1.49.12-3.11 0 0 1-.31 3.3 1.2.96-.26 1.98-.39 3-.4 1.02.01 2.04.14 3 .4 2.28-1.51 3.29-1.2 3.29-1.2.65 1.62.24 2.82.12 3.11.77.82 1.23 1.87 1.23 3.15 0 4.5-2.81 5.48-5.49 5.77.43.36.81 1.09.81 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.68.83.56C20.57 21.88 24 17.48 24 12.29 24 5.78 18.63.5 12 .5Z"/></svg>
              <span>添加你的公司</span>
              <span class="rail__cta-arrow" aria-hidden="true">↗</span>
            </a>
            <p class="rail__hint"><kbd>↑</kbd><kbd>↓</kbd> 切换区域 · <kbd>⌘K</kbd> 搜索 · 点击标记</p>
            <p class="rail__credit">
              数据来源：公司官网及腾讯地图 · GCJ-02坐标 · 2026年8月
            </p>
          </div>
        </aside>

        <section id="detailCard" class="detail-card is-hidden" aria-live="polite"></section>
      </div>

      <div class="hud-top-right">
        <button id="searchTrigger" class="search-trigger" type="button" aria-haspopup="dialog" aria-label="搜索公司">
          <svg class="search-trigger__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="search-trigger__label">搜索</span>
          <kbd>⌘K</kbd>
        </button>
        <a class="icon-btn" href="https://github.com/yzengchn/shenzhen-map" target="_blank" rel="noreferrer noopener" aria-label="在GitHub查看源码">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.7-4.04-1.58-4.04-1.58-.55-1.36-1.33-1.73-1.33-1.73-1.09-.73.08-.71.08-.71 1.2.08 1.83 1.21 1.83 1.21 1.07 1.8 2.81 1.28 3.5.98.11-.76.42-1.28.76-1.57-2.67-.3-5.47-1.3-5.47-5.79 0-1.28.47-2.33 1.23-3.15-.12-.29-.53-1.49.12-3.11 0 0 1-.31 3.3 1.2.96-.26 1.98-.39 3-.4 1.02.01 2.04.14 3 .4 2.28-1.51 3.29-1.2 3.29-1.2.65 1.62.24 2.82.12 3.11.77.82 1.23 1.87 1.23 3.15 0 4.5-2.81 5.48-5.49 5.77.43.36.81 1.09.81 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.68.83.56C20.57 21.88 24 17.48 24 12.29 24 5.78 18.63.5 12 .5Z"/></svg>
        </a>
      </div>

      <aside class="mini-map" aria-label="缩略地图">
        <svg id="miniMapSvg" viewBox="0 0 160 120" role="img" aria-label="深圳轮廓及当前区域">
          <!-- Shenzhen main landmass (Bao'an -> Nanshan -> Futian -> Luohu -> Longhua) -->
          <path
            class="mini-map__land"
            d="M13.4 17.0 L18.8 28.3 L25.3 39.7 L29.6 49.6 L28.2 55.5 L27.1 61.4 L28.5 66.8 L33.2 69.5 L37.5 68.6 L39.7 67.7 L35.4 75.8 L34.3 84.9 L35.4 89.4 L37.5 95.3 L41.8 99.3 L48.3 94.4 L51.2 91.7 L55.9 89.4 L56.6 86.7 L61.3 82.2 L63.8 78.1 L68.5 74.9 L74.6 72.2 L80.0 70.4 L84.7 69.5 L90.8 71.3 L96.2 73.6 L99.8 69.0 L103.4 64.5 L108.8 58.6 L113.1 52.3 L116.0 46.4 L115.3 37.4 L111.7 29.7 L101.6 23.8 L87.2 19.3 L69.2 17.9 L51.2 19.3 L36.8 23.8 L26.0 17.0 Z"
          />
          <!-- Longgang / Pingshan outer districts (faded) -->
          <path class="mini-map__east" d="M114.2 29.7 L130.4 26.1 L144.8 35.1 L153.8 44.2 L137.6 53.2 L116.0 48.7 Z" />
          <!-- Hong Kong across Shenzhen Bay (faded sketch) -->
          <path class="mini-map__hk" d="M53.0 100.7 L65.6 103.9 L76.4 99.3 L81.8 89.4 L78.2 80.3 Z" />
          <g id="miniMapPoints"></g>
        </svg>
        <p>深圳</p>
      </aside>

    </div>

    <dialog id="searchModal" class="search-modal" aria-label="搜索AI公司">
      <div class="search-modal__bar">
        <svg class="search-modal__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="companySearch" type="search" autocomplete="off" placeholder="按名称、行业或区域搜索25家AI公司…" aria-label="搜索公司" />
        <kbd class="search-modal__esc">esc</kbd>
      </div>
      <div id="searchResults" class="search-results" role="listbox"></div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
